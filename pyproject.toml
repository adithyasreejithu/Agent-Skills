[project]
name = "agent-skills"
version = "0.1.0"
description = "Autonomous research pipeline built from Claude Code skills: watches finance videos and reels, writes validated notes and a daily brief."
readme = "README.md"
authors = [
    { name = "Adithya Sreejithu", email = "1adithyapanicker@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.0",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
agent-skills = "agent_skills:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
backtest = [
    "matplotlib>=3.11.2",
]
